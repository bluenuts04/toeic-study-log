<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part3対策 | TOEIC学習サイト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* ---- Part5と共通のブループリント・テーマ ---- */
        --blueprint-navy: #16324a;
        --blueprint-navy-deep: #0f2436;
        --blueprint-line: #6f95ad;
        --blueprint-line-faint: rgba(255, 255, 255, 0.1);
        --paper: #eef2ee;
        --paper-dim: #c7d3d6;
        --safety-orange: #e8631c;
        --safety-orange-dim: #b74e16;
        --ok-green: #6fae7c;
        --ng-red: #d16a5f;
        --font-body: "Noto Sans JP", sans-serif;
        --font-mono: "JetBrains Mono", monospace;

        /* ---- 旧変数名は互換のため残してブループリント配色へ再割当 ---- */
        --navy: var(--paper);
        --navy-light: rgba(255, 255, 255, 0.14);
        --orange: var(--safety-orange);
        --orange-dark: var(--safety-orange-dim);
        --bg: var(--blueprint-navy);
        --card: rgba(255, 255, 255, 0.02);
        --text: var(--paper);
        --muted: var(--paper-dim);
        --border: var(--blueprint-line);
        --correct: var(--ok-green);
        --wrong: var(--ng-red);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        background-color: var(--blueprint-navy);
        background-image:
          linear-gradient(var(--blueprint-line-faint) 1px, transparent 1px),
          linear-gradient(
            90deg,
            var(--blueprint-line-faint) 1px,
            transparent 1px
          );
        background-size: 28px 28px;
        color: var(--paper);
        line-height: 1.7;
        min-height: 100vh;
        padding-bottom: 60px;
      }

      /* ---------- header (Part5と同じ構成) ---------- */
      header {
        padding: 48px 24px 32px;
        border-bottom: 1px dashed var(--blueprint-line);
        max-width: 960px;
        margin: 0 auto;
        background: transparent;
      }
      .home-link {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--paper);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--blueprint-line);
        padding: 6px 12px;
        border-radius: 2px;
        text-decoration: none;
        margin: 0 8px 16px 0;
      }
      .home-link:hover {
        border-color: var(--paper);
        background: rgba(255, 255, 255, 0.12);
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        color: var(--safety-orange);
        text-transform: uppercase;
      }
      header h1 {
        font-size: 30px;
        margin: 10px 0 6px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--paper);
      }
      .sub {
        color: var(--paper-dim);
        font-size: 14px;
        font-family: var(--font-mono);
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }

      /* ---------- 共通ボタン ---------- */
      button.ghost-btn,
      .navbar button,
      .filter-bar button,
      .sheet-row button,
      .pause-btn,
      .stop-btn {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--paper-dim);
        background: transparent;
        border: 1px solid var(--blueprint-line);
        padding: 8px 14px;
        border-radius: 2px;
        cursor: pointer;
      }
      button.ghost-btn:hover,
      .navbar button:hover,
      .filter-bar button:hover,
      .sheet-row button:hover,
      .pause-btn:hover,
      .stop-btn:hover {
        border-color: var(--paper);
        color: var(--paper);
      }
      button.primary-btn,
      .play-btn,
      .grade-btn {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--blueprint-navy-deep);
        background: var(--safety-orange);
        border: none;
        padding: 9px 16px;
        border-radius: 2px;
        cursor: pointer;
        letter-spacing: 0.03em;
      }
      button.primary-btn:hover,
      .play-btn:hover,
      .grade-btn:hover {
        background: #ff7a33;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .navbar {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }
      .navbar button {
        flex: 1;
        color: var(--paper);
        background: rgba(255, 255, 255, 0.06);
        font-family: var(--font-body);
        font-size: 13px;
        padding: 8px 16px;
        transition: all 0.2s;
      }
      .navbar button.active {
        background: var(--safety-orange);
        border-color: var(--safety-orange);
        color: var(--paper);
      }

      /* ---------- filter / panel ---------- */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 24px;
        align-items: center;
        border: 1px solid var(--blueprint-line);
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.02);
        padding: 16px 18px;
      }
      .filter-bar select,
      .filter-bar input {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--blueprint-line);
        color: var(--paper);
        padding: 8px 10px;
        border-radius: 2px;
        font-family: var(--font-body);
        font-size: 13px;
      }
      .filter-bar option {
        background: var(--blueprint-navy-deep);
        color: var(--paper);
      }

      .sheet-panel {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--blueprint-line);
        border-radius: 2px;
        padding: 20px 22px;
        margin-bottom: 28px;
        font-size: 12.5px;
      }
      .sheet-panel h3 {
        margin: 0 0 14px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--safety-orange);
        letter-spacing: 0.08em;
        font-weight: 700;
      }
      .sheet-panel label {
        display: block;
        margin-bottom: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--paper-dim);
        letter-spacing: 0.05em;
      }
      .sheet-panel input[type="text"] {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--blueprint-line);
        color: var(--paper);
        padding: 8px 10px;
        border-radius: 2px;
        font-family: var(--font-mono);
        font-size: 12px;
        margin-top: 4px;
      }
      .sheet-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .toggle-switch {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--paper);
      }
      .toggle-switch label {
        margin-bottom: 0;
        color: var(--paper);
        font-size: 12px;
      }
      .toggle-switch input {
        accent-color: var(--safety-orange);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }

      /* ---------- conversation card ---------- */
      .card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--blueprint-line);
        border-radius: 2px;
        padding: 22px 24px 20px;
        margin-bottom: 22px;
      }
      .badges {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .badge {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 2px;
        letter-spacing: 0.02em;
        color: var(--blueprint-navy-deep);
        background: var(--paper);
      }
      .badge.orange {
        background: var(--safety-orange);
        color: var(--blueprint-navy-deep);
      }
      .badge.date {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid var(--blueprint-line);
        color: var(--paper);
      }

      .play-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        flex-wrap: wrap;
      }
      .play-btn {
        font-size: 13px;
        padding: 10px 20px;
      }
      .play-btn.playing {
        background: var(--ok-green);
      }
      .speed-select {
        font-family: var(--font-mono);
        padding: 7px 8px;
        border-radius: 2px;
        border: 1px solid var(--blueprint-line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--paper);
        font-size: 12px;
      }
      .speed-select option {
        background: var(--blueprint-navy-deep);
        color: var(--paper);
      }

      .script-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px dashed var(--blueprint-line);
        border-left: 2px solid var(--safety-orange);
        border-radius: 2px;
        padding: 14px 16px;
        margin-top: 10px;
        display: none;
        font-size: 14px;
        line-height: 1.7;
      }
      .script-box.show {
        display: block;
      }
      .script-line {
        margin-bottom: 10px;
      }
      .speaker-tag {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 11px;
        color: var(--safety-orange);
        margin-right: 6px;
      }
      .script-en {
        color: var(--paper);
      }
      .script-jp {
        color: var(--paper-dim);
        font-size: 13px;
      }
      .toggle-link {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--safety-orange);
        background: transparent;
        border: 1px dashed var(--safety-orange-dim);
        padding: 5px 10px;
        border-radius: 2px;
        cursor: pointer;
        text-decoration: none;
        margin-left: auto;
      }
      .toggle-link:hover {
        border-color: var(--safety-orange);
      }

      /* ---------- questions ---------- */
      .question {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px dashed var(--blueprint-line);
      }
      .question:first-of-type {
        border-top: none;
      }
      .qtitle {
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 15px;
      }
      .choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--blueprint-line);
        border-radius: 2px;
        cursor: pointer;
        font-size: 13.5px;
        color: var(--paper-dim);
      }
      .choice:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--paper);
      }
      .choice.selected {
        border-color: var(--safety-orange);
        background: rgba(232, 99, 28, 0.15);
        color: var(--paper);
      }
      .choice.correct-ans {
        border-color: var(--ok-green);
        background: rgba(111, 174, 124, 0.15);
        color: var(--ok-green);
      }
      .choice.wrong-ans {
        border-color: var(--ng-red);
        background: rgba(209, 106, 95, 0.15);
        color: var(--ng-red);
      }
      .choice input {
        margin: 0;
        accent-color: var(--safety-orange);
      }
      .explain {
        display: none;
        margin-top: 10px;
        font-size: 13px;
        color: var(--paper);
        background: rgba(255, 255, 255, 0.03);
        border-left: 2px solid var(--safety-orange);
        border-radius: 2px;
        padding: 10px 14px;
      }
      .explain.show {
        display: block;
      }
      .grade-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .result-summary {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--paper);
        font-weight: 700;
      }
      .lastdate {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--paper-dim);
      }

      /* ---------- stats ---------- */
      .stats-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat-box {
        background: rgba(255, 255, 255, 0.06);
        border: 1px dashed var(--blueprint-line);
        border-radius: 2px;
        padding: 16px;
        text-align: center;
      }
      .stat-box .num {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 700;
        color: var(--safety-orange);
      }
      .stat-box .label {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--paper-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 4px;
      }
      #statsTable table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-body);
      }
      #statsTable th {
        color: var(--safety-orange);
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 8px;
        text-align: left;
      }
      #statsTable td {
        color: var(--paper);
        padding: 10px 8px;
      }
      #statsTable tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      #loading {
        text-align: center;
        color: var(--paper-dim);
        font-family: var(--font-mono);
        padding: 20px;
        font-size: 13px;
      }

      /* ===== スマホ表示：文字と余白を縮小して1画面に収まりやすくする ===== */
      @media (max-width: 480px) {
        .container {
          padding: 16px 10px 60px;
        }
        header {
          padding: 24px 14px 20px;
        }
        header h1 {
          font-size: 20px;
        }
        .sub {
          font-size: 12px;
        }
        .card {
          padding: 12px 12px;
          margin-bottom: 14px;
        }
        .sheet-panel,
        .filter-bar {
          padding: 12px;
        }
        .badge {
          font-size: 9.5px;
          padding: 2px 6px;
        }
        .play-btn {
          padding: 9px 16px;
          font-size: 12px;
        }
        .pause-btn,
        .stop-btn {
          padding: 8px 12px;
          font-size: 11px;
        }
        .speed-select {
          font-size: 11px;
        }
        .toggle-link {
          font-size: 10px;
        }
        .script-box {
          padding: 10px;
          font-size: 12.5px;
          line-height: 1.55;
        }
        .script-jp {
          font-size: 11px;
        }
        .qtitle {
          font-size: 13px;
          margin-bottom: 6px;
        }
        .choice {
          font-size: 12px;
          padding: 7px 8px;
        }
        .explain {
          font-size: 11px;
          padding: 8px 10px;
        }
        .grade-btn {
          padding: 9px 14px;
          font-size: 12px;
        }
        .result-summary {
          font-size: 11px;
        }
        .stat-box .num {
          font-size: 18px;
        }
        .stat-box {
          padding: 10px;
        }
      }
      @media (max-width: 360px) {
        .card {
          padding: 10px;
        }
        .script-box {
          font-size: 11.5px;
        }
        .choice {
          font-size: 11.5px;
        }
        .qtitle {
          font-size: 12.5px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="home-link">&larr; ホームに戻る</a>
      <a href="grammar.html" class="home-link">&larr; 文法要点</a>
      <div class="eyebrow">TOEIC / PART 3 &mdash; CONVERSATION DRILL</div>
      <h1>PART 3 会話問題対策</h1>
      <div class="sub">
        会話を聞いて3設問に解答し、正答率をスプレッドシートに自動蓄積する<br />
        Part3 39問/13set &times; 3問　正答率80%目標<br />
        --------------------------------<br />
        ・設問先読み → 会話を聞きながら解答<br />
        ・採点後にスクリプト・和訳・解説を確認<br />
      </div>
    </header>

    <div class="container">
      <div class="navbar">
        <button id="navList" class="active">📋 一覧</button>
        <button id="navStats">📊 統計</button>
      </div>

      <div id="listView">
        <div class="filter-bar">
          <select id="materialFilter">
            <option value="">教材：すべて</option>
          </select>
          <button id="applyFilter">絞り込み</button>
          <button id="shuffleBtn">🔀 シャッフル</button>
        </div>

        <div id="sheetToggleArea" class="sheet-panel">
          <h3>Googleスプレッドシート連携</h3>
          <label
            >Apps Script Web App URL
            <input
              type="text"
              id="sheetUrl"
              placeholder="https://script.google.com/macros/s/xxxx/exec"
            />
          </label>
          <div class="sheet-row">
            <button id="saveUrlBtn">保存</button>
            <button id="testSendBtn">テスト送信</button>
            <div class="toggle-switch">
              <input type="checkbox" id="autoSendToggle" />
              <label for="autoSendToggle">採点時に自動送信</label>
            </div>
          </div>
          <div
            id="sheetStatus"
            style="margin-top: 6px; color: var(--muted)"
          ></div>
        </div>

        <div id="questionsArea"></div>
      </div>

      <div id="statsView" style="display: none">
        <div class="stats-summary">
          <div class="stat-box">
            <div class="num" id="statTotal">0</div>
            <div class="label">総回答数</div>
          </div>
          <div class="stat-box">
            <div class="num" id="statCorrect">0</div>
            <div class="label">正解数</div>
          </div>
          <div class="stat-box">
            <div class="num" id="statRate">0%</div>
            <div class="label">全体正答率</div>
          </div>
          <div class="stat-box">
            <div class="num" id="statAnswered">0</div>
            <div class="label">回答済み設問数</div>
          </div>
        </div>
        <div id="statsTable"></div>
      </div>
    </div>

    <script>
          /* ==========================================================
       データ構造：会話(コンバセーション)ごとに3設問をまとめる
       教材コード: TRN / BIZ / NTC / DMM / WHL / 730 / DIA / D10 / SEN / NEX / SPD / MOS / OFF
       ========================================================== */
          const conversations = [
            {
              id: "TRN-C1-L1",
              material: "TRN",
              materialLabel: "トレーニング TOEIC®test",
              qcode: "C1-L1",
              addedDate: "2026-09-07",
              lines: [
                {
                  speaker: "女性",
                  en: "We'll have some consultants in next week to discuss the presentation for the competition. I want you to attend the meeting as a project manager. Do you have some time on Tuesday?",
                  jp: "来週、コンペのためのプレゼンテーションについて話し合うためにコンサルタントが来ます。あなたにも、プロジェクトマネージャーとして会議に出席して欲しいのですが、火曜日に時間はありますか。",
                },
                {
                  speaker: "男性",
                  en: "Actually, I will be gone on a business trip till Tuesday, but maybe I can have a video conference. Either that, or I'm available on Thursday if they prefer a face-to-face meeting.",
                  jp: "実は火曜日まで出張で出ています。しかし、ビデオ会議はできると思います。もしくは、先方が対面の会議を好むようであれば、木曜日が空いています。",
                },
                {
                  speaker: "女性",
                  en: "Okay. I think a face-to-face should be better. They'll stay for five days, and it should be ok to move the meeting to Thursday. I'll call them now, and let you know the fixed schedule by e-mail.",
                  jp: "わかりました。対面の方がいいでしょう。彼らは5日間滞在しますから、木曜日に会議を移しても大丈夫だと思います。今彼らに電話して、あなたには後で決まったスケジュールをEメールで知らせます。",
                },
              ],
              questions: [
                {
                  qno: 1,
                  text: "What are the speakers mainly discussing?",
                  choices: {
                    A: "Holding a competition",
                    B: "Scheduling a meeting",
                    C: "Planning a business trip",
                    D: "Consulting a vacation plan",
                  },
                  answer: "B",
                  explain:
                    "女性が「会議に出席してほしい、火曜日は空いているか」と尋ね、以降ずっと会議の日程調整の話をしているため、正解は(B)。(A)competitionは会話の目的（コンペ対策）であり主題ではない。",
                },
                {
                  qno: 2,
                  text: "Why cannot the man attend the meeting on Tuesday?",
                  choices: {
                    A: "He will be busy making a presentation.",
                    B: "He will be taking a vacation.",
                    C: "He will be on a business trip.",
                    D: "He will be meeting the consultants.",
                  },
                  answer: "C",
                  explain:
                    '男性は"I will be gone on a business trip till Tuesday"と発言しているため、正解は(C)。',
                },
                {
                  qno: 3,
                  text: "How will the woman tell the fixed schedule to the man?",
                  choices: {
                    A: "By a phone call",
                    B: "By e-mail",
                    C: "By a video call",
                    D: "In person",
                  },
                  answer: "B",
                  explain:
                    '女性は最後に"let you know the fixed schedule by e-mail"と言っているため、正解は(B)。電話はコンサルタントへの連絡に使うだけで、男性への連絡はメール。',
                },
              ],
            },
            {
              id: "TRN-C1-L2",
              material: "TRN",
              materialLabel: "トレーニング TOEIC®test",
              qcode: "C1-L2",
              addedDate: "2026-09-14",
              lines: [
                {

          /* ========================= localStorage ========================= */
          const LS_KEY = "part3_stats_v1";
          const LS_URL_KEY = "part3_sheet_url";
          const LS_AUTOSEND_KEY = "part3_autosend";

          function loadStats() {
            try {
              return JSON.parse(localStorage.getItem(LS_KEY)) || {};
            } catch (e) {
              return {};
            }
          }
          function saveStats(s) {
            localStorage.setItem(LS_KEY, JSON.stringify(s));
          }

          function statKey(convId, qno) {
            return convId + "-Q" + qno;
          }

          function recordAnswer(convId, qno, correct) {
            const stats = loadStats();
            const key = statKey(convId, qno);
            if (!stats[key]) stats[key] = { attempts: 0, correct: 0, lastDate: "" };
            stats[key].attempts += 1;
            if (correct) stats[key].correct += 1;
            const today = new Date();
            stats[key].lastDate =
              today.getFullYear() +
              "-" +
              String(today.getMonth() + 1).padStart(2, "0") +
              "-" +
              String(today.getDate()).padStart(2, "0");
            saveStats(stats);
            return stats[key];
          }

          /* ========================= 音声再生（TTS） ========================= */
          // 性別ごとに異なる声を割り当てる。「男性1」「男性2」のように同性が複数登場する場合は、
          // その性別の中で別の声を順番に割り当て、声の種類が足りない場合のみピッチを少しずらして区別する。
          let voices = [];
          function loadVoices() {
            voices = window.speechSynthesis.getVoices();
          }
          loadVoices();
          if (typeof speechSynthesis !== "undefined") {
            speechSynthesis.onvoiceschanged = loadVoices;
          }

          function getVoicePools() {
            const enVoices = voices.filter(
              (v) => v.lang && v.lang.startsWith("en"),
            );
            const femaleHints = [
              "female",
              "woman",
              "samantha",
              "victoria",
              "zira",
              "susan",
              "karen",
              "tessa",
              "fiona",
              "moira",
              "salli",
              "joanna",
              "kimberly",
              "amy",
              "emma",
              "ivy",
              "kendra",
              "kate",
              "serena",
              "aria",
              "女性",
            ];
            const maleHints = [
              "male",
              "man",
              "daniel",
              "alex",
              "fred",
              "david",
              "mark",
              "aaron",
              "james",
              "brian",
              "joey",
              "justin",
              "matthew",
              "guy",
              "ryan",
              "eric",
              "liam",
              "男性",
            ];
            let female = enVoices.filter((v) =>
              femaleHints.some((h) => v.name.toLowerCase().includes(h)),
            );
            let male = enVoices.filter(
              (v) =>
                maleHints.some((h) => v.name.toLowerCase().includes(h)) &&
                !female.includes(v),
            );
            if (female.length === 0 && male.length === 0 && enVoices.length > 0) {
              // 名前から性別を判別できない端末では、せめて声だけは分かれるように交互に割り振る
              enVoices.forEach((v, i) => {
                if (i % 2 === 0) female.push(v);
                else male.push(v);
              });
            } else {
              if (female.length === 0)
                female = enVoices.filter((v) => !male.includes(v));
              if (male.length === 0)
                male = enVoices.filter((v) => !female.includes(v));
            }
            if (female.length === 0) female = enVoices;
            if (male.length === 0) male = enVoices;
            return { female, male };
          }

          // 会話ごとに、登場する話者ラベル(「女性」「男性1」「男性2」「男性3」など、各性別最大3名まで)に声を割り当てる
          const FEMALE_PITCH_STEPS = [1.0, 1.18, 0.85];
          const MALE_PITCH_STEPS = [1.0, 0.82, 1.15];

          function buildSpeakerVoiceMap(conv) {
            const pools = getVoicePools();
            const counters = { female: 0, male: 0 };
            const map = {};
            conv.lines.forEach((line) => {
              const label = line.speaker;
              if (map[label]) return;
              const isFemale = label.startsWith("女性");
              const pool = isFemale ? pools.female : pools.male;
              const idx = isFemale ? counters.female++ : counters.male++;
              const voice = pool.length ? pool[idx % pool.length] : null;
              // 声のバリエーションが足りず同じ声を再利用する場合、性別ごとに最大3段階のピッチで区別する
              const pitchSteps = isFemale ? FEMALE_PITCH_STEPS : MALE_PITCH_STEPS;
              const repeatGroup = pool.length ? Math.floor(idx / pool.length) : idx;
              const pitch = pitchSteps[repeatGroup % pitchSteps.length];
              map[label] = { voice, pitch };
            });
            return map;
          }

          function speakConversation(conv, speedRate, btns) {
            if (!("speechSynthesis" in window)) {
              alert("この端末は音声読み上げに対応していません");
              return;
            }
            window.speechSynthesis.cancel();
            const { playBtn, pauseBtn, stopBtn } = btns;
            const voiceMap = buildSpeakerVoiceMap(conv);
            const items = conv.lines.map((line) => ({
              text: line.en,
              ...voiceMap[line.speaker],
            }));

            function setPlayingUI() {
              playBtn.disabled = true;
              playBtn.classList.add("playing");
              playBtn.textContent = "🔊 再生中...";
              pauseBtn.disabled = false;
              pauseBtn.textContent = "⏸ 一時停止";
              stopBtn.disabled = false;
            }
            function resetUI() {
              playBtn.disabled = false;
              playBtn.classList.remove("playing");
              playBtn.textContent = "▶ 会話を再生";
              pauseBtn.disabled = true;
              pauseBtn.textContent = "⏸ 一時停止";
              stopBtn.disabled = true;
            }

            setPlayingUI();
            let i = 0;
            let stopped = false;

            function playNext() {
              if (stopped) return;
              if (i >= items.length) {
                resetUI();
                return;
              }
              const item = items[i];
              const u = new SpeechSynthesisUtterance(item.text);
              if (item.voice) u.voice = item.voice;
              u.lang = "en-US";
              u.rate = speedRate;
              u.pitch = item.pitch;
              u.onend = () => {
                i++;
                playNext();
              };
              u.onerror = () => {
                resetUI();
              };
              window.speechSynthesis.speak(u);
            }
            playNext();

            stopBtn.onclick = () => {
              stopped = true;
              window.speechSynthesis.cancel();
              resetUI();
            };
          }

          /* ========================= 描画 ========================= */
          function materialOptions() {
            const sel = document.getElementById("materialFilter");
            const codes = [...new Set(conversations.map((c) => c.material))];
            codes.forEach((code) => {
              const label = conversations.find(
                (c) => c.material === code,
              ).materialLabel;
              const opt = document.createElement("option");
              opt.value = code;
              opt.textContent = code + " " + label;
              sel.appendChild(opt);
            });
          }

          function renderConversation(conv) {
            const stats = loadStats();
            const card = document.createElement("div");
            card.className = "card";

            const lastDates = conv.questions
              .map((q) => stats[statKey(conv.id, q.qno)]?.lastDate)
              .filter(Boolean);
            const latest = lastDates.sort().slice(-1)[0];

            card.innerHTML = `
        <div class="badges">
          <span class="badge">${conv.material} ${conv.materialLabel}</span>
          <span class="badge orange">${conv.qcode}</span>
          <span class="badge date">最終回答: ${latest ? latest : "未回答"}</span>
        </div>
        <div class="play-row">
          <button class="play-btn">▶ 会話を再生</button>
          <button class="pause-btn" disabled>⏸ 一時停止</button>
          <button class="stop-btn" disabled>⏹ 停止</button>
          <select class="speed-select">
            <option value="1">標準(TOEICと同程度)</option>
            <option value="1.15">やや速め</option>
            <option value="1.3">速め</option>
            <option value="1.5">かなり速い</option>
          </select>
          <span class="toggle-link script-toggle">スクリプト表示/非表示</span>
        </div>
        <div class="script-box"></div>
        <div class="questions-holder"></div>
        <div class="grade-row">
          <button class="grade-btn">採点する</button>
          <span class="result-summary"></span>
        </div>
      `;

            // スクリプト
            const scriptBox = card.querySelector(".script-box");
            conv.lines.forEach((line) => {
              const div = document.createElement("div");
              div.className = "script-line";
              div.innerHTML = `<span class="speaker-tag">${line.speaker}</span><br>
          <span class="script-en">${line.en}</span><br>
          <span class="script-jp">${line.jp}</span>`;
              scriptBox.appendChild(div);
            });
            card.querySelector(".script-toggle").onclick = () => {
              scriptBox.classList.toggle("show");
            };

            // 再生・一時停止・停止
            const playBtn = card.querySelector(".play-btn");
            const pauseBtn = card.querySelector(".pause-btn");
            const stopBtn = card.querySelector(".stop-btn");

            playBtn.onclick = () => {
              const rate = parseFloat(card.querySelector(".speed-select").value);
              speakConversation(conv, rate, { playBtn, pauseBtn, stopBtn });
            };
            pauseBtn.onclick = () => {
              if (
                window.speechSynthesis.speaking &&
                !window.speechSynthesis.paused
              ) {
                window.speechSynthesis.pause();
                pauseBtn.textContent = "▶ 再開";
              } else if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                pauseBtn.textContent = "⏸ 一時停止";
              }
            };

            // 設問
            const qHolder = card.querySelector(".questions-holder");
            conv.questions.forEach((q) => {
              const qDiv = document.createElement("div");
              qDiv.className = "question";
              qDiv.dataset.qno = q.qno;
              let choicesHtml = "";
              Object.keys(q.choices).forEach((letter) => {
                choicesHtml += `
            <label class="choice" data-letter="${letter}">
              <input type="radio" name="${conv.id}-q${q.qno}" value="${letter}">
              <span>(${letter}) ${q.choices[letter]}</span>
            </label>`;
              });
              qDiv.innerHTML = `
          <div class="qtitle">${q.qno}. ${q.text}</div>
          ${q.imageUrl ? `<div style="text-align:center;margin:10px 0;"><img src="${q.imageUrl}" style="max-width:260px;width:100%;height:auto;border-radius:6px;border:1px solid var(--border);" alt="Graphic"></div>` : ""}
          <div class="choices">${choicesHtml}</div>
          <div class="explain"></div>
        `;
              qHolder.appendChild(qDiv);

              qDiv.querySelectorAll(".choice").forEach((choiceEl) => {
                choiceEl.addEventListener("click", () => {
                  qDiv
                    .querySelectorAll(".choice")
                    .forEach((c) => c.classList.remove("selected"));
                  choiceEl.classList.add("selected");
                });
              });
            });

            // 採点
            card.querySelector(".grade-btn").onclick = () => {
              let correctCount = 0;
              conv.questions.forEach((q) => {
                const qDiv = qHolder.querySelector(
                  `.question[data-qno="${q.qno}"]`,
                );
                const selected = qDiv.querySelector(".choice.selected");
                const selectedLetter = selected ? selected.dataset.letter : null;
                const isCorrect = selectedLetter === q.answer;
                if (isCorrect) correctCount++;

                qDiv.querySelectorAll(".choice").forEach((c) => {
                  if (c.dataset.letter === q.answer) c.classList.add("correct-ans");
                  else if (c.dataset.letter === selectedLetter && !isCorrect)
                    c.classList.add("wrong-ans");
                });

                const explainEl = qDiv.querySelector(".explain");
                explainEl.textContent = q.explain;
                explainEl.classList.add("show");

                recordAnswer(conv.id, q.qno, isCorrect);
                sendToSheetIfEnabled(conv, q, isCorrect);
              });
              scriptBox.classList.add("show");
              card.querySelector(".result-summary").textContent =
                `${correctCount} / ${conv.questions.length} 問正解`;
              renderConversation.refreshBadge && renderConversation.refreshBadge();
            };

            return card;
          }

          function renderList(list) {
            const area = document.getElementById("questionsArea");
            area.innerHTML = "";
            list.forEach((conv) => area.appendChild(renderConversation(conv)));
          }

          function applyFilterAndRender() {
            const material = document.getElementById("materialFilter").value;
            let list = conversations;
            if (material) list = list.filter((c) => c.material === material);
            renderList(list);
          }

          document.getElementById("applyFilter").onclick = applyFilterAndRender;
          document.getElementById("shuffleBtn").onclick = () => {
            const shuffled = [...conversations].sort(() => Math.random() - 0.5);
            renderList(shuffled);
          };

          /* ========================= ナビ切り替え ========================= */
          document.getElementById("navList").onclick = () => {
            document.getElementById("listView").style.display = "block";
            document.getElementById("statsView").style.display = "none";
            document.getElementById("navList").classList.add("active");
            document.getElementById("navStats").classList.remove("active");
          };
          document.getElementById("navStats").onclick = () => {
            document.getElementById("listView").style.display = "none";
            document.getElementById("statsView").style.display = "block";
            document.getElementById("navList").classList.remove("active");
            document.getElementById("navStats").classList.add("active");
            renderStats();
          };

          /* ========================= 統計 ========================= */
          function renderStats() {
            const stats = loadStats();
            let total = 0,
              correct = 0,
              answered = 0;
            const rows = [];
            conversations.forEach((conv) => {
              conv.questions.forEach((q) => {
                const key = statKey(conv.id, q.qno);
                const s = stats[key];
                if (s) {
                  total += s.attempts;
                  correct += s.correct;
                  answered += 1;
                  rows.push({
                    label: `${conv.qcode} Q${q.qno}`,
                    material: conv.material,
                    attempts: s.attempts,
                    correct: s.correct,
                    rate: Math.round((s.correct / s.attempts) * 100),
                    lastDate: s.lastDate,
                  });
                }
              });
            });
            document.getElementById("statTotal").textContent = total;
            document.getElementById("statCorrect").textContent = correct;
            document.getElementById("statRate").textContent =
              total > 0 ? Math.round((correct / total) * 100) + "%" : "0%";
            document.getElementById("statAnswered").textContent = answered;

            const tableDiv = document.getElementById("statsTable");
            if (rows.length === 0) {
              tableDiv.innerHTML = `<p style="color:var(--muted);font-size:13px;">まだ回答記録がありません。</p>`;
              return;
            }
            rows.sort((a, b) => a.rate - b.rate);
            let html = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
        <tr style="border-bottom:1px solid var(--border);text-align:left;">
          <th style="padding:6px;">設問</th><th>教材</th><th>正答率</th><th>回答数</th><th>最終回答</th>
        </tr>`;
            rows.forEach((r) => {
              html += `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:6px;">${r.label}</td>
          <td>${r.material}</td>
          <td>${r.rate}%</td>
          <td>${r.correct}/${r.attempts}</td>
          <td>${r.lastDate}</td>
        </tr>`;
            });
            html += "</table>";
            tableDiv.innerHTML = html;
          }

          /* ========================= Googleスプレッドシート連携 ========================= */
          const DEFAULT_SHEET_URL =
            "https://script.google.com/macros/s/AKfycbxOa0G0AeOBEzRpmTC8anyEy8-PfVojH14BlIbkRwV9EOJYs2q86tF12A_-YKvXgZh7/exec";

          function initSheetUI() {
            const urlInput = document.getElementById("sheetUrl");
            const savedUrl = localStorage.getItem(LS_URL_KEY) || DEFAULT_SHEET_URL;
            urlInput.value = savedUrl;
            document.getElementById("autoSendToggle").checked =
              localStorage.getItem(LS_AUTOSEND_KEY) === "true";
          }

          document.getElementById("saveUrlBtn").onclick = () => {
            localStorage.setItem(
              LS_URL_KEY,
              document.getElementById("sheetUrl").value.trim(),
            );
            document.getElementById("sheetStatus").textContent =
              "URLを保存しました。";
          };

          document.getElementById("autoSendToggle").onchange = (e) => {
            localStorage.setItem(LS_AUTOSEND_KEY, e.target.checked);
          };

          document.getElementById("testSendBtn").onclick = () => {
            const url = document.getElementById("sheetUrl").value.trim();
            if (!url) {
              document.getElementById("sheetStatus").textContent =
                "URLを入力してください。";
              return;
            }
            const params = new URLSearchParams({
              sheet: "PART3復習",
              id: "TEST-Q0",
              material: "TRN トレーニング TOEIC®test",
              field: "C1-L1",
              qno: "0",
              attempts: "1",
              correct: "1",
              rate: "100",
              lastDate: new Date().toISOString().slice(0, 10),
            });
            fetch(url, { method: "POST", body: params })
              .then(() => {
                document.getElementById("sheetStatus").textContent =
                  "テスト送信しました。スプレッドシートを確認してください。";
              })
              .catch(() => {
                document.getElementById("sheetStatus").textContent =
                  "送信に失敗しました。URLを確認してください。";
              });
          };

          function sendToSheetIfEnabled(conv, q, isCorrect) {
            const enabled = localStorage.getItem(LS_AUTOSEND_KEY) === "true";
            if (!enabled) return;
            const url = localStorage.getItem(LS_URL_KEY) || DEFAULT_SHEET_URL;
            if (!url) return;
            const stats = loadStats();
            const s = stats[statKey(conv.id, q.qno)];
            const params = new URLSearchParams({
              sheet: "PART3復習",
              id: statKey(conv.id, q.qno),
              material: `${conv.material} ${conv.materialLabel}`,
              field: conv.qcode,
              qno: String(q.qno),
              attempts: String(s.attempts),
              correct: String(s.correct),
              rate: String(Math.round((s.correct / s.attempts) * 100)),
              lastDate: s.lastDate,
            });
            fetch(url, { method: "POST", body: params }).catch(() => {});
          }

          /* ========================= 初期化 ========================= */
          materialOptions();
          initSheetUI();
          renderList(conversations);
    </script>
  </body>
</html>
