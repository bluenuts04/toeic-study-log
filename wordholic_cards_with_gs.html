<!DOCTYPE html>
<html lang="ja">
<head>

    <style>

    <!-- Google Sheets Connector -->
    <script>
        class GoogleSheetsConnector {
            constructor() {
                this.scriptUrl = null;
                this.isConfigured = false;
            }
            
            setScriptUrl(url) {
                if (!url || !url.includes('script.google.com')) {
                    return false;
                }
                this.scriptUrl = url;
                this.isConfigured = true;
                localStorage.setItem('gasUrl', url);
                return true;
            }
            
            loadConfiguration() {
                const savedUrl = localStorage.getItem('gasUrl');
                if (savedUrl) {
                    this.scriptUrl = savedUrl;
                    this.isConfigured = true;
                    return true;
                }
                return false;
            }
            
            async syncToSheets(words) {
                if (!this.isConfigured || !this.scriptUrl) {
                    return { success: false, error: 'Google Sheets URLが設定されていません' };
                }
                
                try {
                    const payload = {
                        action: 'sync',
                        words: words
                    };
                    
                    const response = await fetch(this.scriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        localStorage.setItem('lastGsSync', new Date().toISOString());
                    }
                    return result;
                } catch (error) {
                    return { success: false, error: error.message };
                }
            }
            
            async recordSessionToSheets(sessionData) {
                if (!this.isConfigured || !this.scriptUrl) {
                    return { success: false };
                }
                
                try {
                    const payload = {
                        action: 'recordSession',
                        sessionData: sessionData
                    };
                    
                    const response = await fetch(this.scriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    return await response.json();
                } catch (error) {
                    return { success: false, error: error.message };
                }
            }
            
            clearConfiguration() {
                this.scriptUrl = null;
                this.isConfigured = false;
                localStorage.removeItem('gasUrl');
            }
            
            getStatus() {
                return {
                    isConfigured: this.isConfigured,
                    lastSync: localStorage.getItem('lastGsSync'),
                    scriptUrl: this.scriptUrl ? this.scriptUrl.substring(0, 50) + '...' : null
                };
            }
        }
        
        const gsConnector = new GoogleSheetsConnector();
    </script>
    
    <script>
        let allWords = [];
        let sessionCards = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        let currentMode = 'visual';
        let sessionResponses = [];
        let sessionCorrect = 0;
        let sessionIncorrect = 0;
        
        window.addEventListener('load', function() {
            loadStoredWords();
            updateDataSummary();
            gsConnector.loadConfiguration();
            updateSyncStatus();
            
            // URLが入力されている場合は表示
            const savedUrl = localStorage.getItem('gasUrl');
            if (savedUrl) {
                document.getElementById('gsUrl').value = savedUrl.substring(0, 50) + '...';
            }
        });
        
        function loadStoredWords() {
            const stored = localStorage.getItem('wordHolicWords');
            if (stored) {
                allWords = JSON.parse(stored);
            }
        }
        
        function saveWords() {
            localStorage.setItem('wordHolicWords', JSON.stringify(allWords));
        }
        
        function updateDataSummary() {
            if (allWords.length > 0) {
                const summaryEl = document.getElementById('dataSummary');
                const summaryText = document.getElementById('dataSummaryText');
                summaryText.innerHTML = `蓄積単語数: <strong>${allWords.length}</strong> 個`;
                summaryEl.style.display = 'block';
            }
        }
        
        function updateSyncStatus() {
            const status = gsConnector.getStatus();
            const syncEl = document.getElementById('syncStatus');
            const syncText = document.getElementById('syncText');
            const gsSyncDiv = document.getElementById('gsSync');
            
            if (status.isConfigured) {
                syncEl.classList.add('connected');
                syncText.textContent = '接続済み ✓';
                gsSyncDiv.style.display = 'block';
            } else {
                syncEl.classList.remove('connected');
                syncText.textContent = '未接続';
                gsSyncDiv.style.display = 'none';
            }
        }
        
        function configureGoogleSheets() {
            const url = document.getElementById('gsUrl').value.trim();
            if (!url) {
                showError('URLを入力してください');
                return;
            }
            
            if (gsConnector.setScriptUrl(url)) {
                updateSyncStatus();
                showSuccess('✅ Google Sheets が接続されました');
                document.getElementById('gsUrl').value = url.substring(0, 50) + '...';
            } else {
                showError('無効なGoogle Apps Script URLです');
            }
        }
        
        function clearGSConfig() {
            if (confirm('Google Sheets の接続を解除しますか？')) {
                gsConnector.clearConfiguration();
                updateSyncStatus();
                document.getElementById('gsUrl').value = '';
                showSuccess('接続を解除しました');
            }
        }
        
        async function syncToGoogleSheets() {
            if (!gsConnector.isConfigured) {
                showError('Google Sheets が接続されていません');
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 同期中...';
            
            const result = await gsConnector.syncToSheets(allWords);
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync"></i> 今すぐ同期';
            
            if (result.success) {
                showSuccess(`✅ ${result.synced}個の単語をGoogle Sheetsに同期しました`);
            } else {
                showError('同期に失敗しました: ' + result.error);
            }
        }
        
        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 3000);
        }
        
        function showSuccess(msg) {
            const successEl = document.getElementById('successMsg');
            successEl.textContent = msg;
            successEl.classList.add('show');
            setTimeout(() => successEl.classList.remove('show'), 3000);
        }
        
        function loadCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('CSVファイルを選択してください');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csv = e.target.result;
                    parseCSV(csv);
                } catch (error) {
                    showError('CSVの読み込みに失敗しました: ' + error.message);
                }
            };
            reader.readAsText(file, 'utf-8');
        }
        
        function parseCSV(csv) {
            const lines = csv.trim().split('\n').filter(line => line.trim());
            const newWords = [];
            
            for (const line of lines) {
                const parts = line.split(',');
                if (parts.length >= 3) {
                    const english = parts[0].trim();
                    const meaningPart = parts[1].trim();
                    const code = parts[2].trim();
                    
                    const posMatch = meaningPart.match(/^([^）)]*[）)]\s*)?(.*)$/);
                    const pos = posMatch && posMatch[1] ? posMatch[1].trim() : '---';
                    const japanese = posMatch && posMatch[2] ? posMatch[2].trim() : meaningPart;
                    
                    if (english) {
                        const existingIndex = allWords.findIndex(w => w.english === english);
                        
                        if (existingIndex === -1) {
                            newWords.push({
                                english, pos, japanese, code,
                                correct: 0, incorrect: 0, lastReviewDate: null
                            });
                        }
                    }
                }
            }
            
            if (newWords.length === 0) {
                showError('新しい単語がありません');
                return;
            }
            
            allWords = [...allWords, ...newWords];
            saveWords();
            updateDataSummary();
            
            // Google Sheets に自動同期
            if (gsConnector.isConfigured) {
                gsConnector.syncToSheets(allWords);
            }
            
            showSuccess(`✅ ${newWords.length}個の新規単語を追加しました！`);
            setTimeout(() => startNewSession(), 1500);
        }
        
        function startNewSession() {
            if (allWords.length === 0) {
                showError('学習する単語がありません');
                return;
            }
            
            const count = Math.min(10, allWords.length);
            const shuffled = [...allWords].sort(() => Math.random() - 0.5);
            sessionCards = shuffled.slice(0, count);
            
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('studySection').classList.add('active');
            document.getElementById('summarySection').classList.remove('active');
            
            currentCardIndex = 0;
            isFlipped = false;
            currentMode = 'visual';
            sessionResponses = [];
            sessionCorrect = 0;
            sessionIncorrect = 0;
            
            updateCardDisplay();
            updateStats();
        }
        
        function updateCardDisplay() {
            const card = sessionCards[currentCardIndex];
            
            document.getElementById('englishWord').textContent = card.english;
            document.getElementById('posPart').textContent = card.pos;
            document.getElementById('meaningJp').textContent = card.japanese;
            document.getElementById('sourceCode').textContent = `教材: ${card.code}`;
            
            const accuracy = card.correct + card.incorrect > 0 ?
                Math.round((card.correct / (card.correct + card.incorrect)) * 100) : 0;
            document.getElementById('wordAccuracy').textContent = accuracy + '%';
            
            const lastReview = card.lastReviewDate ?
                formatDate(card.lastReviewDate) : '初回';
            document.getElementById('lastReview').textContent = lastReview;
            
            isFlipped = false;
            document.getElementById('cardFront').style.display = 'block';
            document.getElementById('cardBack').classList.remove('visible');
            
            if (currentMode === 'audio') {
                document.getElementById('cardFront').style.display = 'none';
            }
            
            updateProgress();
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const diffTime = today - date;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return '今日';
            if (diffDays === 1) return '昨日';
            if (diffDays < 7) return `${diffDays}日前`;
            return date.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
        }
        
        function updateProgress() {
            const progress = ((currentCardIndex + 1) / sessionCards.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('sessionProgress').textContent = `${currentCardIndex + 1}/${sessionCards.length}`;
        }
        
        function updateStats() {
            document.getElementById('sessionCorrect').textContent = sessionCorrect;
            document.getElementById('sessionIncorrect').textContent = sessionIncorrect;
            
            const total = sessionCorrect + sessionIncorrect;
            const accuracy = total > 0 ? Math.round((sessionCorrect / total) * 100) : 0;
            document.getElementById('sessionRate').textContent = accuracy + '%';
        }
        
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
            event.target.closest('.mode-tab').classList.add('active');
            isFlipped = false;
            updateCardDisplay();
        }
        
        document.getElementById('flipCard').addEventListener('click', function() {
            if (currentMode === 'visual') {
                isFlipped = !isFlipped;
                if (isFlipped) {
                    document.getElementById('cardFront').style.display = 'none';
                    document.getElementById('cardBack').classList.add('visible');
                } else {
                    document.getElementById('cardFront').style.display = 'block';
                    document.getElementById('cardBack').classList.remove('visible');
                }
            } else {
                if (!isFlipped) {
                    isFlipped = true;
                    document.getElementById('cardFront').style.display = 'block';
                    document.getElementById('cardBack').classList.add('visible');
                }
            }
        });
        
        function playAudio() {
            const card = sessionCards[currentCardIndex];
            const utterance = new SpeechSynthesisUtterance(card.english);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
        
        function recordResponse(correct) {
            const card = sessionCards[currentCardIndex];
            
            sessionResponses.push({
                english: card.english,
                correct: correct,
                timestamp: new Date().toISOString()
            });
            
            if (correct) sessionCorrect++;
            else sessionIncorrect++;
            
            const wordIndex = allWords.findIndex(w => w.english === card.english);
            if (wordIndex !== -1) {
                if (correct) allWords[wordIndex].correct++;
                else allWords[wordIndex].incorrect++;
                allWords[wordIndex].lastReviewDate = new Date().toISOString();
            }
            
            saveWords();
            updateStats();
            
            if (currentCardIndex < sessionCards.length - 1) {
                currentCardIndex++;
                updateCardDisplay();
            } else {
                showSummary();
            }
        }
        
        async function showSummary() {
            document.getElementById('studySection').classList.remove('active');
            document.getElementById('summarySection').classList.add('active');
            
            document.getElementById('summaryCorrect').textContent = sessionCorrect;
            document.getElementById('summaryIncorrect').textContent = sessionIncorrect;
            
            const total = sessionCorrect + sessionIncorrect;
            const accuracy = total > 0 ? Math.round((sessionCorrect / total) * 100) : 0;
            document.getElementById('summaryRate').textContent = accuracy + '%';
            
            // Google Sheets に記録
            if (gsConnector.isConfigured) {
                const result = await gsConnector.recordSessionToSheets({
                    responses: sessionResponses
                });
                
                if (result.success) {
                    const resultDiv = document.getElementById('gsSyncResult');
                    resultDiv.innerHTML = `✅ セッション記録をGoogle Sheetsに保存しました`;
                    resultDiv.style.background = '#c6f6d5';
                    resultDiv.style.color = '#22543d';
                    resultDiv.style.display = 'block';
                }
            }
        }
        
        function returnToUpload() {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('studySection').classList.remove('active');
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('csvFile').value = '';
        }
    </script>
</body>
</html>
