<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PART 5 診断ログ | TOEIC文法トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blueprint-navy: #16324a;
    --blueprint-navy-deep: #0f2436;
    --blueprint-line: #6f95ad;
    --blueprint-line-faint: rgba(255,255,255,0.10);
    --paper: #eef2ee;
    --paper-dim: #c7d3d6;
    --safety-orange: #e8631c;
    --safety-orange-dim: #b74e16;
    --ok-green: #6fae7c;
    --font-body: 'Noto Sans JP', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--blueprint-navy);
    background-image:
      linear-gradient(var(--blueprint-line-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line-faint) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--paper);
    font-family: var(--font-body);
    line-height: 1.7;
    min-height: 100vh;
  }

  header {
    padding: 48px 24px 32px;
    border-bottom: 1px dashed var(--blueprint-line);
    max-width: 920px;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--safety-orange);
    text-transform: uppercase;
  }

  h1 {
    font-size: 30px;
    margin: 10px 0 6px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .sub {
    color: var(--paper-dim);
    font-size: 14px;
    font-family: var(--font-mono);
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }

  .tag-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--paper-dim);
    background: transparent;
    border: 1px solid var(--blueprint-line);
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .tag-btn:hover, .tag-btn.active {
    border-color: var(--safety-orange);
    color: var(--safety-orange);
  }

  .entry {
    position: relative;
    border: 1px solid var(--blueprint-line);
    border-radius: 2px;
    margin-bottom: 22px;
    padding: 22px 24px 20px 64px;
    background: rgba(255,255,255,0.02);
  }

  .entry-no {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 48px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 22px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--safety-orange-dim);
    border-right: 1px dashed var(--blueprint-line);
  }

  .entry-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .category {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--blueprint-navy-deep);
    background: var(--paper-dim);
    padding: 3px 8px;
    border-radius: 2px;
  }

  .date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
  }

  .question {
    font-size: 16px;
    margin-bottom: 14px;
  }
  .blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 2px solid var(--safety-orange);
    text-align: center;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .choice {
    padding: 6px 10px;
    border: 1px solid var(--blueprint-line);
    border-radius: 2px;
    color: var(--paper-dim);
  }
  .choice.correct {
    border-color: var(--ok-green);
    color: var(--ok-green);
  }

  .dim-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0;
    color: var(--blueprint-line);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .dim-line::before, .dim-line::after {
    content: "";
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--blueprint-line) 0 4px, transparent 4px 8px);
  }

  .explanation {
    font-size: 14px;
    color: var(--paper);
  }
  .explanation-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--safety-orange);
    display: block;
    margin-bottom: 4px;
  }

  form.add-entry {
    border: 1px dashed var(--blueprint-line);
    border-radius: 2px;
    padding: 22px 24px;
    margin-top: 40px;
  }
  form.add-entry h2 {
    font-size: 15px;
    font-family: var(--font-mono);
    color: var(--safety-orange);
    margin: 0 0 16px;
    letter-spacing: 0.05em;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    margin-bottom: 4px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--blueprint-line);
    color: var(--paper);
    padding: 8px 10px;
    border-radius: 2px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button.submit {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--safety-orange);
    color: var(--blueprint-navy-deep);
    border: none;
    padding: 10px 20px;
    border-radius: 2px;
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  button.submit:hover { background: #ff7a33; }

  .note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">TOEIC / PART 5 &mdash; GRAMMAR ERROR LOG</div>
  <h1>診断ログ</h1>
  <div class="sub">間違えた問題を1件ずつ記録し、パターンを可視化する</div>
</header>

<main>
  <div class="toolbar" id="toolbar"></div>
  <div id="entries"></div>

  <form class="add-entry" id="addForm">
    <h2>+ NEW ENTRY 追加</h2>
    <div class="field">
      <label>カテゴリ</label>
      <select id="f-category">
        <option>品詞</option>
        <option>動詞・時制</option>
        <option>前置詞</option>
        <option>接続詞</option>
        <option>代名詞</option>
        <option>その他</option>
      </select>
    </div>
    <div class="field">
      <label>問題文(空欄は ___ で表記)</label>
      <textarea id="f-question" placeholder="The manager ___ the report before the meeting."></textarea>
    </div>
    <div class="field row2">
      <div>
        <label>選択肢(カンマ区切り)</label>
        <input id="f-choices" placeholder="review, reviews, reviewed, reviewing">
      </div>
      <div>
        <label>正解</label>
        <input id="f-answer" placeholder="reviewed">
      </div>
    </div>
    <div class="field">
      <label>解説メモ</label>
      <textarea id="f-explanation" placeholder="過去完了の文脈。beforeの後ろは基準時点より前の動作。"></textarea>
    </div>
    <button type="submit" class="submit">記録する</button>
    <div class="note">
      ※ このフォームは画面上への追加のみで、保存はされません。<br>
      永続化するには、下部の <code>entries</code> 配列に直接オブジェクトを追記してGitHubにpushしてください。
    </div>
  </form>
</main>

<script>
  // ここに問題を追記していく(1件が1オブジェクト)
  const entries = [
    {
      category: "動詞・時制",
      date: "2026-08-01",
      question: "By the time the inspector arrived, the crew ___ the safety check.",
      choices: ["complete", "completes", "had completed", "completing"],
      answer: "had completed",
      explanation: "過去のある時点(inspector arrived)よりさらに前に完了していた動作 → 過去完了形。現場の点検記録と同じ「基準時点より前」の考え方。"
    },
    {
      category: "前置詞",
      date: "2026-08-01",
      question: "The new sensor was installed ___ the manufacturer's specifications.",
      choices: ["in accordance with", "according", "depend on", "based"],
      answer: "in accordance with",
      explanation: "「〜に従って」の定型表現。according toと混同しやすいが、according単体では使えない。"
    }
  ];

  const entriesEl = document.getElementById('entries');
  const toolbarEl = document.getElementById('toolbar');
  let activeFilter = 'すべて';

  function render() {
    const categories = ['すべて', ...new Set(entries.map(e => e.category))];
    toolbarEl.innerHTML = categories.map(c =>
      `<button class="tag-btn ${c === activeFilter ? 'active' : ''}" data-cat="${c}">${c}</button>`
    ).join('');

    const filtered = activeFilter === 'すべて' ? entries : entries.filter(e => e.category === activeFilter);

    entriesEl.innerHTML = filtered.map((e, i) => `
      <div class="entry">
        <div class="entry-no">${String(entries.indexOf(e) + 1).padStart(3, '0')}</div>
        <div class="entry-meta">
          <span class="category">${e.category}</span>
          <span class="date">${e.date}</span>
        </div>
        <div class="question">${e.question.replace('___', '<span class="blank">___</span>')}</div>
        <div class="choices">
          ${e.choices.map(c => `<span class="choice ${c === e.answer ? 'correct' : ''}">${c}</span>`).join('')}
        </div>
        <div class="dim-line">EXPLANATION</div>
        <div class="explanation">
          <span class="explanation-label">解説</span>
          ${e.explanation}
        </div>
      </div>
    `).join('');

    toolbarEl.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.cat;
        render();
      });
    });
  }

  document.getElementById('addForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const q = document.getElementById('f-question').value.trim();
    const answer = document.getElementById('f-answer').value.trim();
    if (!q || !answer) return;
    entries.push({
      category: document.getElementById('f-category').value,
      date: new Date().toISOString().slice(0, 10),
      question: q,
      choices: document.getElementById('f-choices').value.split(',').map(s => s.trim()).filter(Boolean),
      answer: answer,
      explanation: document.getElementById('f-explanation').value.trim()
    });
    ev.target.reset();
    render();
  });

  render();
</script>

</body>
</html>
